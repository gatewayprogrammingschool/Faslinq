name: .NET

on:
  push:
    branches: [ main, release/* ]
    tags:
      - v*
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:

    runs-on: windows-latest

    permissions:
      # Push the tag for each published version.
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # GitVersion.MsBuild computes the package version from the full history.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test Faslinq.Tests/Faslinq.Tests.csproj -c Release --no-build -f net6.0

    - name: Pack
      run: dotnet pack Faslinq/Faslinq.csproj -c Release --no-build -o packages

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: packages/*.nupkg

    # Publish on a merge to main (or a manual run on main) and on a published GitHub release.
    # --skip-duplicate makes a run whose version is already on NuGet a no-op.
    - name: Publish to NuGet
      id: publish
      if: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || github.event_name == 'release' }}
      shell: pwsh
      env:
        NUGET_KEY: ${{ secrets.NUGET_KEY }}
      run: |
        if (-not $env:NUGET_KEY) {
          Write-Error "The NUGET_KEY secret is not set for this repository."
          exit 1
        }
        # Push each package by its full path: dotnet nuget push doesn't expand packages/*.nupkg on Windows.
        $packages = @(Get-ChildItem packages -Filter *.nupkg)
        if ($packages.Count -eq 0) {
          Write-Error "No packages to push."
          exit 1
        }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --api-key $env:NUGET_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    # GitVersion gives every untagged commit on main the same version, so tag each published
    # version; the next merge then gets the next patch version instead of a duplicate.
    - name: Tag published version
      if: ${{ steps.publish.outcome == 'success' && github.event_name != 'release' }}
      shell: pwsh
      run: |
        $package = Get-ChildItem packages/Faslinq.*.nupkg | Select-Object -First 1
        $version = $package.BaseName.Substring('Faslinq.'.Length)
        if (git tag --list $version) {
          Write-Host "Tag $version already exists."
          exit 0
        }
        git tag $version
        git push origin $version
