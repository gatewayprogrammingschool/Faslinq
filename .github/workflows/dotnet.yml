name: .NET

on:
  push:
    branches: [ main, release/* ]
    tags:
      - v*
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # GitVersion.MsBuild computes the package version from the full history.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test Faslinq.Tests/Faslinq.Tests.csproj -c Release --no-build -f net6.0

    - name: Pack
      run: dotnet pack Faslinq/Faslinq.csproj -c Release --no-build -o packages

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: packages/*.nupkg

    # Publish on a merge to main (or a manual run on main) and on a published GitHub release.
    # --skip-duplicate makes a run whose version is already on NuGet a no-op.
    - name: Publish to NuGet
      if: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || github.event_name == 'release' }}
      run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.NUGET_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
